CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_THREAD_ID_PREFIX=y

CONFIG_SHELL=n

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_DBG=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=n
CONFIG_LLEXT_HEAP_SIZE=4096
CONFIG_LLEXT_SHELL=n

# Enable kernel heap (in bytes)
CONFIG_HEAP_MEM_POOL_SIZE=131072

# Enable memory debugging  
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_VALIDATE=y
CONFIG_SYS_HEAP_INFO=y
CONFIG_KERNEL_MEM_POOL=y
CONFIG_SYS_HASH_MAP=y

# C library malloc arena (in bytes)
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

# Threading configuration
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=0
CONFIG_TIMESLICE_PRIORITY=0

# Dynamic thread stack allocation
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y

# Increase system workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Enable hashmap subsystem
CONFIG_SYS_HASH_MAP=y

# Enable POSIX API and pthread support
CONFIG_POSIX_API=y
CONFIG_POSIX_THREAD_THREADS_MAX=16
CONFIG_MAX_PTHREAD_MUTEX_COUNT=16

# Enable thread awareness for debugging tools
CONFIG_DEBUG_THREAD_INFO=n

# Optimize for size
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_COMPILER_OPT="-Os"



