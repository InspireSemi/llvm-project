CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_THREAD_ID_PREFIX=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_SHELL=n
CONFIG_SHELL_CMD_BUFF_SIZE=8192
CONFIG_SHELL_LOG_LEVEL_INF=y
CONFIG_SHELL_STACK_SIZE=4096

CONFIG_LLEXT=y
CONFIG_LLEXT_LOG_LEVEL_DBG=y
CONFIG_LLEXT_IMPORT_ALL_GLOBALS=n
CONFIG_LLEXT_HEAP_SIZE=1024
CONFIG_LLEXT_SHELL=n

# Enable kernel heap
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Enable memory debugging
CONFIG_KERNEL_MEM_POOL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Threading configuration
CONFIG_NUM_PREEMPT_PRIORITIES=56
CONFIG_MAIN_THREAD_PRIORITY=7
CONFIG_TIMESLICING=y
CONFIG_TIMESLICE_SIZE=0
CONFIG_TIMESLICE_PRIORITY=0

# Dynamic thread stack allocation
CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_STACK_INFO=y

# Increase system workqueue stack
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048


